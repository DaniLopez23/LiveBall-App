services:
  frontend-react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend-fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend-fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LIVE_XML_PATH: ${LIVE_XML_PATH:-/shared/f24-simulated-data.xml}
      F24_XML_PATH: ${F24_XML_PATH:-/shared/f24-simulated-data.xml}
      F9_XML_PATH: ${F9_XML_PATH:-/shared/f9-simulated-data.xml}
      F40_XML_PATH: ${F40_XML_PATH:-/shared/F40-squad-23.xml}
      F42_XML_PATH: ${F42_XML_PATH:-/shared/f42-23-2023-results.xml}
      XML_POLL_INTERVAL_SECONDS: ${XML_POLL_INTERVAL_SECONDS:-3}
      STATS_XML_POLL_INTERVAL_SECONDS: ${STATS_XML_POLL_INTERVAL_SECONDS:-60}
    ports:
      - "${BACKEND_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - shared-volume:/shared
    depends_on:
      match-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('APP_PORT', '8000') + '/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  match-simulator:
    build:
      context: .
      dockerfile: match-simulator/Dockerfile
    environment:
      SOURCE_XML_PATH: ${SOURCE_XML_PATH:-/app/data/events/f24-23-2023-2372222-eventdetails.xml}
      SOURCE_STATS_XML_PATH: ${SOURCE_STATS_XML_PATH:-/app/data/stats/f9-23-2023-2372222-matchresults.xml}
      OUTPUT_XML_PATH: ${OUTPUT_XML_PATH:-/shared/f24-simulated-data.xml}
      OUTPUT_STATS_XML_PATH: ${OUTPUT_STATS_XML_PATH:-/shared/f9-simulated-data.xml}
      F40_SOURCE_XML_PATH: ${F40_SOURCE_XML_PATH:-/app/data/F40-squad-23.xml}
      F40_OUTPUT_XML_PATH: ${F40_OUTPUT_XML_PATH:-/shared/F40-squad-23.xml}
      F42_SOURCE_XML_PATH: ${F42_SOURCE_XML_PATH:-/app/data/f42-23-2023-results.xml}
      F42_OUTPUT_XML_PATH: ${F42_OUTPUT_XML_PATH:-/shared/f42-23-2023-results.xml}
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      WRITE_INTERVAL_SECONDS: ${WRITE_INTERVAL_SECONDS:-3}
    volumes:
      - shared-volume:/shared
    healthcheck:
      test: ["CMD-SHELL", "test -s \"$${OUTPUT_XML_PATH}\" && test -s \"$${OUTPUT_STATS_XML_PATH}\" && test -s \"$${F40_OUTPUT_XML_PATH}\" && test -s \"$${F42_OUTPUT_XML_PATH}\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  shared-volume:
